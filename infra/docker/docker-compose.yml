networks:
  lspe-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: lspe-postgres
    environment:
      POSTGRES_USER: lspe_user
      POSTGRES_PASSWORD: lspe_password
      POSTGRES_DB: lspe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - lspe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lspe_user -d lspe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: lspe-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lspe_user
      RABBITMQ_DEFAULT_PASS: lspe_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - lspe-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
