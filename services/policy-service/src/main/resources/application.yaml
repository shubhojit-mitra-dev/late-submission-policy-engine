server:
  port: 8081

spring:
  application:
    name: policy-service

  datasource:
    url: jdbc:postgresql://localhost:5432/lspe_db?currentSchema=policy_schema
    username: lspe_user
    password: lspe_password
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PolicyServicePool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: policy_schema
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: policy_schema
    default-schema: policy_schema

logging:
  level:
    com.lspe.policy: DEBUG
    org.flywaydb: INFO
